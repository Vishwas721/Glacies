# Install once: uv run pre-commit install
# Run on everything: uv run pre-commit run --all-files
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]  # pnpm lockfile is multi-document
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      # Datasets belong in data/ (gitignored), never in git.
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
      - id: prettier-web
        name: prettier (web)
        entry: pnpm -C web exec prettier --write .
        language: system
        files: ^web/
        pass_filenames: false
