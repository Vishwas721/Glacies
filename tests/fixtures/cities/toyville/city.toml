[city]
id = "toyville"
name = "Toyville"
country = "XX"
timezone = "UTC"
crs_projected = "EPSG:32643"
bbox = [77.0, 12.0, 77.1, 12.1]

[zoning]
system = "h3"
resolution = 8

[network]
feeds = ["toy_gtfs"]
service_date = 2026-10-13  # a Tuesday

[sources.toy_gtfs]
kind = "gtfs"
mode = "bus"
source = "Glacies test fixture"
url = "https://example.invalid/toy-gtfs"
license = "CC0-1.0"
verified = true
nature = "observed"
route_number_pattern = '^\S+'

[sources.toy_gtfs.coverage_reference]
route_count_min = 2
route_count_max = 4
source = "Glacies test fixture"
verified = false

[sources.toy_population]
kind = "population_raster"
source = "Glacies test fixture"
url = "https://example.invalid/toy-pop"
license = "CC0-1.0"
verified = false
nature = "estimated"

[sources.toy_osm]
kind = "osm_pbf"
source = "Glacies test fixture"
url = "https://example.invalid/toy-osm"
license = "ODbL-1.0"
verified = true
nature = "observed"

[sources.toy_landcover]
kind = "landcover_raster"
source = "Glacies test fixture"
url = "https://example.invalid/toy-landcover"
license = "CC-BY-4.0"
verified = true
nature = "estimated"

[sources.toy_buildings]
kind = "buildings"
source = "Glacies test fixture"
url = "https://example.invalid/toy-buildings"
license = "CC-BY-4.0"
verified = true
nature = "estimated"

[attraction]
job_poi_categories = ["office", "shop", "food", "health", "education", "industrial", "craft"]
opportunity_index_total = 1000
validation_hubs = "validation/hubs.geojson"

[attraction.baseline]
name = "baseline"
building_area = 0.7
job_pois = 0.3
building_confidence = 0.65

[[attraction.sensitivity]]
name = "equal"
building_area = 0.5
job_pois = 0.5
building_confidence = 0.75
