[project]
name = "glacies"
version = "0.1.0"
description = "Urban transit digital twin and scenario simulation platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishwas" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "osmium>=4.0",
    "polars>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
glacies = "glacies.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glacies"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "C4",       # comprehensions
    "DTZ",      # timezone-aware datetimes (reproducibility)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: long-running tests (city-scale data)",
    "integration: requires docker services or downloaded datasets",
]

[tool.coverage.run]
source = ["glacies"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
