[project]
name = "glacies"
version = "0.1.0"
description = "Urban transit digital twin and scenario simulation platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishwas" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "glacies-raptor",
    "h3>=4.2",
    "osmium>=4.0",
    "polars>=1.0",
    "psutil>=6.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "scipy>=1.13",
    "shapely>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
glacies = "glacies.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "scipy-stubs>=1.17.1.5",
    "types-psutil>=7.2.2.20260906",
    "types-shapely>=2.1.0.20260728",
]

[tool.uv.sources]
# The Rust core, built with maturin on `uv sync` (needs a Rust toolchain).
glacies-raptor = { path = "crates/raptor-py" }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glacies"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "C4",       # comprehensions
    "DTZ",      # timezone-aware datetimes (reproducibility)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "crates/raptor-py/glacies_raptor.pyi"]

[[tool.mypy.overrides]]
# These ship no type information and no stub package exists.
module = ["h3", "h3.*", "rasterio", "rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    # Raised inside rasterio's own transform helpers, not by Glacies code.
    'ignore:Use `@` matmul instead of `\*` mul operator:PendingDeprecationWarning',
]
markers = [
    "slow: long-running tests (city-scale data)",
    "integration: requires docker services or downloaded datasets",
]

[tool.coverage.run]
source = ["glacies"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
