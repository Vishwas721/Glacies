# City definition for Bengaluru.
#
# The Glacies engine is city-agnostic: everything city-specific lives in this file.
# `verified = true` means the URL and licence were checked by hand (Phase 1 handoff,
# 2026-10-04). `nature` is the provenance label of the data (see docs/glossary.md).

[city]
id = "bengaluru"
name = "Bengaluru"
country = "IN"
timezone = "Asia/Kolkata"
crs_projected = "EPSG:32643"   # UTM zone 43N, metres — used for distances/areas

# Study area bounding box, WGS84 [min_lon, min_lat, max_lon, max_lat].
# Assumed: the extent of every BMTC stop within 50 km of Majestic (97.8 % of stops), chosen
# 2026-10-05 from the M2 validation. Refine to an official boundary later.
bbox = [77.14, 12.61, 77.96, 13.41]

[zoning]
system = "h3"
resolution = 8      # Assumed (~0.74 km² cells): 10,661 zones overlap the bbox.
# Zone building totals are stored at each confidence cut-off so Phase 3 can test sensitivity.
building_confidence_thresholds = [0.65, 0.75]

[network]
feeds = ["bmtc_gtfs", "bmrcl_gtfs"]
# A non-holiday Tuesday inside both feeds' calendars (BMRCL 2026-10-20 is a holiday).
service_date = 2026-10-13
drop_implausible_speed_trips = true

[walk]
# Assumed (2026-10-05). Trunk roads are walkable: in Bengaluru, corridors such as Outer Ring Road
# are tagged trunk and separate sidewalks are rarely mapped.
highways = [
    "residential", "service", "footway", "path", "pedestrian", "steps", "living_street",
    "track", "unclassified", "tertiary", "tertiary_link", "secondary", "secondary_link",
    "primary", "primary_link", "trunk", "trunk_link", "corridor", "cycleway", "bridleway",
    "platform", "road",
]
# access/foot=private stay walkable (decided 2026-10-05): about 5,700 km of gated layouts,
# apartment complexes and tech-park roads where trips actually start and end. Assumed; may let
# shortest paths cut through campuses outsiders could not use.
exclude_foot = ["no", "use_sidepath"]
exclude_access = ["no"]
allow_foot = ["yes", "designated", "permissive"]
max_snap_m = 300.0
# Avoid snapping stops onto isolated fragments (e.g. a lone footway inside a campus).
snap_to_largest_component = true

[routing]
# Assumed, Phase 2 handoff (2026-10-06).
max_rounds = 4               # vehicles per journey, i.e. up to 3 transfers
walking_speed_m_s = 1.2
max_access_walk_m = 800.0    # origin -> first stop, last stop -> destination
max_transfer_walk_m = 400.0  # one walking leg between vehicles
min_transfer_time_s = 60     # alighting and reaching the next boarding point
# Assumed (decided 2026-10-06, docs/validation/routing-analysis.md): entering a metro station
# (entrance, security check, stairs to the platform) takes 4 minutes. Line changes inside an
# interchange (e.g. RV Road) are free: no repeated security or ticketing (decided 2026-10-07).
station_entry_s = { metro = 240 }

[accessibility]
# Phase 3 handoff (2026-10-07) and M2 decisions (2026-10-07). All Assumed.
window_start = "07:30"        # weekday AM peak; departures every minute, 07:30 ... 09:29
window_end = "09:30"
departure_step_s = 60
percentiles = [25, 50, 75]    # p50 is the headline; p25/p75 show reliability
max_travel_time_min = 120     # longer trips count as not reached
max_walk_only_m = 2000.0      # zone to zone on foot without transit (~28 min)
thresholds_min = [15, 30, 45, 60]
# Summary metric: population-weighted mean share of estimated jobs reachable within 45 min (p50).
headline_threshold_min = 45
headline_percentile = 50
# Zones within 5 km of the bbox edge are flagged (destinations outside the study area are missing).
edge_buffer_m = 5000.0

[scenario]
# Assumed, Phase 4 M2 (2026-10-08). Timetables of routes added by scenarios: running time is
# straight-line distance x detour_factor at the route's speed_kmh, plus dwell_s at each stop.
# detour_factor = mean walk/straight ratio of 1,997 consecutive bus-stop pairs (median 1.06);
# see docs/validation/scenario-detour.md (`glacies scenario calibrate`).
detour_factor = 1.15
dwell_s = 20

[attraction]
# Employment proxy, Phase 3 handoff (2026-10-07). Its output is Estimated ("estimated jobs");
# every value below is Assumed. Each part is a share of the city total before weighting.
# All job-type POI categories count; amenity_other (worship, parking, ...) does not.
job_poi_categories = ["office", "shop", "food", "health", "education", "industrial", "craft"]
# Results are reported as shares of the city's estimated employment. For display only, shares
# are scaled to this base as an "Estimated Opportunity Index"; it is not a job count.
opportunity_index_total = 5_000_000
# Eight hand-drawn hubs (QGIS, 2026-10-07). Pass rule: >= 80 % of hub zones rank in the top
# 20 % of zones; the top 5 % is reported alongside it to tune the weights.
validation_hubs = "validation/employment_hubs.geojson"
hub_pass_rank = 0.20
hub_report_rank = 0.05
hub_pass_share = 0.80

[attraction.baseline]
name = "baseline"
# Changed 2026-10-08 from 0.70/0.30 (user decision after the Phase 3 M5 sensitivity table):
# footprint area alone ranks zones like population (homes dominate), while equal weights keep
# the hub top-5 % score (64 %) and raise hub concentration from 1.50x to 1.84x.
building_area = 0.50
job_pois = 0.50
building_confidence = 0.65

[[attraction.sensitivity]]
name = "previous-baseline"   # the Phase 3 handoff weights, kept for comparison
building_area = 0.70
job_pois = 0.30
building_confidence = 0.65

[[attraction.sensitivity]]
name = "poi-led"
building_area = 0.30
job_pois = 0.70
building_confidence = 0.65

[[attraction.sensitivity]]
name = "pois-only"
building_area = 0.0
job_pois = 1.0
building_confidence = 0.65

[[attraction.sensitivity]]
name = "area-only"
building_area = 1.0
job_pois = 0.0
building_confidence = 0.65

[[attraction.sensitivity]]
name = "baseline-c75"
building_area = 0.50
job_pois = 0.50
building_confidence = 0.75

[sources.bmtc_gtfs]
kind = "gtfs"
mode = "bus"
source = "Vonter/bmtc-gtfs"
url = "https://github.com/Vonter/bmtc-gtfs"
license = "ODbL-1.0"
verified = true
nature = "observed"
notes = "Unofficial; omits routes without live-tracking telematics. One service_id covers all 7 days."
# GTFS route rows are variants ("255-J", "255-J KBS-HNS"); the route number is the text before
# the first space, which is how official route counts are made.
route_number_pattern = '^\S+'
# Ticketing-system test runs ("EXP Test AFCS", "O TEST AFCS 258", ...) are not revenue service.
exclude_route_pattern = '(?i)\btest\b'

[sources.bmtc_gtfs.coverage_reference]
route_count_min = 2200
route_count_max = 2492
source = "Web search summary, 2026-10-05; no primary BMTC source found"
verified = false

[sources.bmrcl_gtfs]
kind = "gtfs"
mode = "metro"
source = "Vonter/bmrcl-gtfs"
url = "https://github.com/Vonter/bmrcl-gtfs"
license = "ODbL-1.0"
verified = true
nature = "observed"
notes = "Exact-times feed; used for routing. Stops include platforms/entrances (location_type)."

[sources.bmrcl_gtfs_frequencies]
kind = "gtfs"
mode = "metro"
source = "Vonter/bmrcl-gtfs (frequencies variant)"
url = "https://github.com/Vonter/bmrcl-gtfs"
license = "ODbL-1.0"
verified = true
nature = "observed"
notes = "Headway-based variant of the same feed. Archived for reference, not used for routing."

[sources.bmrcl_ridership]
kind = "ridership"
mode = "metro"
source = "Vonter/bmrcl-ridership-hourly"
url = "https://github.com/Vonter/bmrcl-ridership-hourly"
license = "ODbL-1.0"
verified = true
nature = "observed"
notes = "Hourly station entries/exits and station-pair (OD) flows. Primary demand calibration target."
format = "vonter-hourly"

[sources.osm]
kind = "osm_pbf"
source = "Geofabrik — India southern zone"
url = "https://download.geofabrik.de/asia/india.html"
license = "ODbL-1.0"
verified = true
nature = "observed"
notes = "Large extract; clip to the bbox with osmium before loading anything in Python."

[sources.worldpop]
kind = "population_raster"
source = "WorldPop — India 100m constrained, 2021, release R2025A"
url = "https://hub.worldpop.org/"
license = "CC-BY-4.0"
verified = true
nature = "estimated"
notes = "Modelled population raster; record the 2021 vintage wherever it is used."

[sources.open_buildings]
kind = "buildings"
source = "Google Open Buildings v3"
url = "https://sites.research.google/open-buildings/"
license = "CC-BY-4.0 / ODbL-1.0"
verified = true
nature = "estimated"
notes = "Use snapshot v3-2026-10-05 (exported for the enlarged bbox). Snapshot v3 covers only the old bbox."

[sources.worldcover]
kind = "landcover_raster"
source = "ESA WorldCover 10m 2021 v200 (tile N12E075)"
url = "https://esa-worldcover.org/"
license = "CC-BY-4.0"
verified = true
nature = "estimated"
