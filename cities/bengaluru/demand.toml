# Demand priors and calibration settings for Bengaluru (Phase 5).
#
# Every number here is Assumed unless it says Observed. Citations marked verified = false were
# checked only against secondary sources that quote the CMP; replace them with the CMP page
# number when the PDF is checked. Reviewed against the data on 2026-10-09.

[demand]
trip_purpose = "HBW_AM_peak"   # home-based work, outbound, 08:00-10:00

# Origins are zones with a stop within the access walk (3,465 of 10,661 zones, 68.8 % of the
# population, tt-matrix BUILD_REPORT) or a ride to a metro station ([demand.ride_access]).
# Destinations need the walk. The dropped population and trips are reported, not hidden.
origins = "transit_served_zones"
exclude_intrazonal = true        # a zone reaches itself in 0 s; transit does not serve these
# Zone pairs whose fastest journey is on foot at half or more of the departures are not
# transit trips (2026-10-09: they took 20 % of the trips before this rule).
exclude_walk_pairs = true

[demand.ride_access]
# Auto, shared auto, two-wheeler or feeder ride to a metro station at the home end (ADR 0015).
# All values Assumed. Without it the 800 m walk starves terminal stations (2026-10-09:
# Baiyappanahalli 345 simulated vs 5,393 observed entries, Kengeri 37 vs 2,023). A test that
# added the population 0.8-4 km from each station to simulated entries raised held-out R²
# of entry shares from -1.34 to 0.03; 3, 4 and 5 km did about equally well.
# Check, not input: the Ease of Moving Index 2022 Bengaluru profile (Ola Mobility Institute)
# is quoted as 38.2 % of PT users walking to PT and 58.9 % using autos/shared autos/cabs for
# the first/last mile (not verified against the report; covers bus and metro, both ends). The
# station-flows report gives the model's share of metro trips that start with a ride.
max_km = 4.0           # straight line, zone point to platform
speed_kmh = 15.0       # auto / two-wheeler in AM traffic, door to station
detour_factor = 1.3    # road distance / straight line
penalty_min = 5.0      # finding an auto or parking a two-wheeler
source = "Assumed; to be replaced by a BMRCL or DULT station access-mode survey"
verified = false

[demand.priors.trip_rate]
# HBW trips per person starting 08:00-10:00.
# Derivation: 1.24 trips/person/day including walk (CMP p.2-50) x 25 % work and business
# (CMP p.2-51, Fig 2-23; return trips are a separate 50 %, so these are outbound) = 0.31
# outbound work trips/person/day, x 0.5 of them starting 08:00-10:00 (Assumed; range 0.4-0.6).
# Sanity check (Observed): metro entries in hours 8-9 are 47 % of 05:00-12:59 entries.
# Changed 2026-10-09 from 0.10 (which assumed 0.4 / 2 = 0.2 outbound work trips/person/day).
value = 0.155
range = [0.12, 0.19]
source = "Bengaluru CMP 2020 (DULT) final report, p.2-50 (trip rate 1.24) and p.2-51 (purposes)"
verified = true

[demand.priors.transit_share]
# Share of those trips made by public transport: 47.8 % of motorised peak-hour trips (CMP
# Table 2-36, p.2-57; bus, minibus, school and chartered bus; base year 2015, before most of
# the metro). Including walking, PT is 32 % of all trips (Fig 2-22), but work trips are rarely
# walked. The 70 % figure is a 2030+ target and must not be used.
value = 0.45
range = [0.35, 0.50]
source = "Bengaluru CMP 2020 (DULT) final report, Table 2-36 p.2-57 (peak-hour motorised split)"
verified = true

[demand.priors.trip_length]
# Mean trip length used for the "within a stated range" check in the definition of done.
# CMP bus trip length 10.7 km (Table 2-30, p.2-51) or "about 12 km" (p.2-57). Observed: metro
# AM trips travel 11.2 stations on average (stationpair-hourly-enhanced, hours 8-9).
mean_km = 11.0
accept_km = [8.0, 14.0]
source = "Bengaluru CMP 2020 (DULT) final report, Table 2-30 p.2-51 and p.2-57 (bus)"
verified = true

[demand.cost]
# The Phase 2 matrix stores door-to-door time percentiles, not generalised cost. p50 over the
# 07:30-09:30 departures already includes the initial wait. Simulated. Pairs not stored
# (p25 > 120 min) are unreachable and get zero weight.
column = "p50_s"

[demand.gravity]
# Exponential friction exp(-beta x minutes of p50 time). Calibrated 2026-10-09 by
# `glacies demand calibrate` on station entry shares (ADR 0014), with rides to stations
# (ADR 0015): best RMSE 0.0127 at 0.0259 (1/beta = 39 min). The objective is nearly flat over
# 0.019-0.037, so beta is only weakly identified (docs/validation/demand.md). Walk access only,
# it was 0.0321.
beta_per_min = 0.0259
tolerance = 1e-6       # largest relative error of any row or column sum
max_iterations = 5000

[demand.calibration]
friction_function = "exponential"
dataset = "bmrcl_ridership"
snapshot = "2026-10-04"
hours = [8, 9]               # entries counted by hour of tap-in: 08:00-09:59
# Observed data covers 2025-08-01..2025-09-30 with 08-19..08-31 missing. The Yellow Line
# stations appear from 2025-08-11, so earlier dates are a different network. Tue-Thu, minus
# 2025-08-14 and 2025-09-04 (the days before the Independence Day and Eid-e-Milad long
# weekends; AM entries 142k and 148k against ~155k) and minus 09-29/09-30 (Dasara period).
dates = [
    "2025-08-12", "2025-08-13",
    "2025-09-02", "2025-09-03",
    "2025-09-09", "2025-09-10", "2025-09-11",
    "2025-09-16", "2025-09-17", "2025-09-18",
    "2025-09-23", "2025-09-24", "2025-09-25",
]
# The Yellow Line opened in August 2025 with only a few trains; the GTFS used for routing
# (service date 2026-10-13) runs 16-18 trips per direction 08:00-10:00. Its ridership is not
# comparable, so its stations are left out of calibration and scored separately.
# RV Road (Green + Yellow interchange) stays in.
exclude_lines = ["Yellow"]
objective = "rmse_entry_share"   # fit the shape; GEH and the level ratio are reported
# β search (Assumed): 12 log-spaced values from 0.005 to 0.2 per minute (1/β from 200 to
# 5 minutes), then 8 golden-section steps around the best; Furness at 1e-4 during the search.
beta_min = 0.005
beta_max = 0.2
grid_points = 12
refine_steps = 8
sweep_tolerance = 1e-4

# Held-out validation set, chosen by the user before calibration (15 of the 68 stations left
# after excluding the Yellow Line, 22 %; about 27 % of their AM entries). Never used to choose beta. Names match the ridership data.
held_out_stations = [
    "Indiranagar",
    "Jayanagar",
    "Peenya Industry",
    "Swami Vivekananda Road",
    "National College",
    "Rajajinagar",
    "Halasuru",
    "Dasarahalli",
    "Sandal Soap Factory",
    "Banashankari",
    "Yelachenahalli",
    "Baiyappanahalli",
    "Mysore Road",
    "Kengeri",
    "Yeshwantpur",
]

# --- Further purposes and gateways (Phase 5 M8, ADR 0016) ---------------------------------------

[[demand.purposes]]
# Students and staff travelling to schools and colleges, 08:00-10:00. Same friction (beta) and
# cost as work trips (Assumed). Check, not input: WRI India (2023, "Improving metro access in
# India", Fig 6) found 22 % of Bengaluru metro riders travel for education, 68 % for work.
name = "education"
attractor = "poi_education"   # OSM schools, colleges and universities per zone (Estimated)

[demand.purposes.trip_rate]
# 1.24 trips/person/day (CMP p.2-50) x 15 % education (CMP p.2-51, outbound; returns are
# counted separately) = 0.186 outbound education trips/person/day, x 0.5 starting 08:00-10:00
# (Assumed; many schools start before 08:00).
value = 0.09
range = [0.06, 0.12]
source = "Bengaluru CMP 2020 (DULT) final report, p.2-50 and p.2-51 (purposes)"
verified = true

[demand.purposes.transit_share]
# Assumed. School buses count as public transport in the CMP but are not in the GTFS; the CMP
# bus-stop survey has education as 11.8 % of bus passengers (Table 2-23, p.2-44).
value = 0.30
range = [0.20, 0.45]
source = "Assumed; CMP 2020 Table 2-23 (education 11.8 % of bus passengers) as context"
verified = false

[demand.gateways]
# Passengers arriving at rail and long-distance bus terminals start trips in the city. Size
# = factor x daily passengers. The factor folds together the share of arrivals in
# 08:00-10:00, arrivals per counted (outward) passenger and the share continuing by transit;
# none is published (no rail-to-metro transfer share found), so `glacies demand calibrate`
# fits it on the training stations. Coordinates are from the OSM extract (2026-10-02).
# Daily passengers: 2023-24 outward (originating) passengers / 365, from the Railway Board
# station categorisation as reported by Deccan Herald (11 Sep 2024); SWR's 2023-24 list
# confirms the categories but gives no counts. Terminating passengers are assumed equal
# (SWR 2024-25: Bengaluru's total footfall is about twice its originating passengers).
factor = 0.0      # set from the calibration
factor_max = 0.5  # at most half a day's passengers in two hours, all by transit

