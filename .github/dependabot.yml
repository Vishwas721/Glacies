# Weekly, grouped updates so a solo maintainer gets at most a handful of PRs per week.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }
    commit-message: { prefix: "build(deps-py)" }

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      rust: { patterns: ["*"] }
    commit-message: { prefix: "build(deps-rust)" }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      web: { patterns: ["*"] }
    ignore:
      # typescript-eslint does not support the TS 7 native compiler yet.
      - dependency-name: typescript
        versions: [">=7"]
    commit-message: { prefix: "build(deps-web)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci(deps)" }
