# Local infrastructure for Glacies. Start with: docker compose up -d
name: glacies

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glacies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glacies}
      POSTGRES_DB: ${POSTGRES_DB:-glacies}
    ports:
      # Host port 5433: 5432 is often taken by a native PostgreSQL install.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Simulation queue and state (PRD §50). Valkey speaks the Redis protocol under BSD-3;
  # Redis itself is RSALv2/SSPL from 7.4 (ADR 0021).
  redis:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgis-data:
  redis-data:
